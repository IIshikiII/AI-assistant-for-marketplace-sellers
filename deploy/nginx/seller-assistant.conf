# Ставится deploy/server-setup.sh в /etc/nginx/sites-available/. Правьте здесь, не на сервере.
# Сертификат выпущен certbot заранее и продлевается certbot.timer.

server {
    listen 443 ssl http2;
    server_name utility-monitor.ru;

    ssl_certificate     /etc/letsencrypt/live/utility-monitor.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/utility-monitor.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;  # загрузка файлов (выгрузки маркетплейсов, фото)

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Ответы LLM бывают долгими и идут потоком (SSE) — не буферизуем.
        proxy_buffering off;
        proxy_read_timeout 180s;
    }
}

server {
    listen 80;
    server_name utility-monitor.ru;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
